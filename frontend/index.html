<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Upokoron.com — Electronics for everyone</title>
    <meta
      name="description"
      content="Genuine electronics and accessories, stocked in Dhaka and delivered to your door. Cash on delivery available."
    />
    <meta name="theme-color" content="#1e4be0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Hind Siliguri covers Bangla and Latin in one family. Loaded here rather
      than via @import in the stylesheet: Tailwind's expansion pushes a later
      @import past the top of the file, CSS requires @import to come first,
      and PostCSS then drops it -- leaving the whole site on a system font
      with nothing in the console to say why.

      preconnect opens the connection to the font host while the CSS is still
      downloading, so the face arrives sooner.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
